<title>Latin Flashcards</title>

<style>
body{margin:0;background:white;font-family:'Cormorant Garamond', serif;color:#222;text-align:center;}
.title{font-family:'Cinzel', serif;font-size:60px;color:#c9a227;margin-top:40px;letter-spacing:3px;text-shadow:0 0 8px rgba(201,162,39,0.25);}
.subtitle{font-size:22px;margin-top:10px;color:#666;}
.flashcard-container{display:flex;justify-content:center;margin-top:60px;margin-bottom:80px;}
.flashcard{width:700px;height:500px;perspective:2000px;cursor:pointer;}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform 0.9s;transform-style:preserve-3d;}
.flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
.flashcard-front,.flashcard-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:25px;overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,0.18);background:white;}
.flashcard-front{display:flex;justify-content:center;align-items:center;border:3px solid #e6d18c;}
.flashcard-front img{width:100%;height:100%;object-fit:cover;}
.flashcard-back{transform:rotateY(180deg);}
.flashcard-back img{width:100%;height:100%;object-fit:cover;}
.click-note{margin-top:-40px;font-size:20px;color:#777;}
.disclaimer{font-size:12px;color:#999;margin-top:100px;margin-bottom:20px;font-family:Arial, sans-serif;}
.bottom-title{font-family:'Cinzel', serif;font-size:34px;color:#c9a227;margin-bottom:60px;}
.secret-link{margin-bottom:40px;font-size:14px;}
.secret-link a{text-decoration:none;color:#888;}
.secret-link a:hover{color:#c9a227;}
@media (max-width: 1024px){.title{font-size:48px;}.flashcard{width:88vw;height:62vw;}}
</style>
